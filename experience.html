<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>새로운 경험 | 신유찬</title>
    <style>
      :root { --blue: #2997ff; --ink: #ffffff; --night: #272729; }
      * { box-sizing: border-box; }
      body { margin: 0; color: var(--ink); background: var(--night); font-family: "SF Pro Text", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size: 17px; line-height: 1.47; letter-spacing: -0.024em; }
      main { width: min(100% - 48px, 820px); min-height: 100vh; margin: 0 auto; padding: 96px 0; text-align: center; }
      .eyebrow { margin: 0 0 12px; color: #ccc; font-weight: 600; }
      h1 { margin: 0; font-family: "SF Pro Display", system-ui, sans-serif; font-size: clamp(48px, 7vw, 72px); line-height: 1.07; letter-spacing: -0.04em; }
      .lead { max-width: 620px; margin: 20px auto 0; font-size: clamp(21px, 2.6vw, 28px); line-height: 1.2; }
      .note { max-width: 620px; margin: 48px auto 0; padding: 28px 0; border-top: 1px solid rgb(255 255 255 / 22%); border-bottom: 1px solid rgb(255 255 255 / 22%); text-align: left; }
      .button { display: inline-flex; min-height: 44px; align-items: center; justify-content: center; margin-top: 40px; padding: 10px 20px; border-radius: 9999px; color: #fff; background: var(--blue); text-decoration: none; }
      .button:active { transform: scale(.95); }
      @media (max-width: 640px) { main { width: min(100% - 40px, 820px); padding: 72px 0; } }
    </style>
  </head>
  <body>
    <main>
      <h1>새로운 경험</h1>
      <p class="lead">차후에 채워나갈 예정입니다.</p>
      <a class="button" href="index.html#interests">홈으로 돌아가기</a>
    </main>
  </body>
</html>
