<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="신유찬의 개인 홈페이지" />
    <title>신유찬 | 개인 홈페이지</title>
    <style>
      :root { --ink: #1e293b; --muted: #64748b; --surface: #fff; --background: #f5f7fb; --accent: #2563eb; --line: #e2e8f0; }
      * { box-sizing: border-box; }
      body { margin: 0; color: var(--ink); background: var(--background); font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; line-height: 1.7; }
      .page { width: min(100% - 32px, 760px); margin: 0 auto; padding: 64px 0 48px; }
      header { padding: 14px 4px 42px; }
      .eyebrow { margin: 0 0 10px; color: var(--accent); font-size: .95rem; font-weight: 700; letter-spacing: .04em; }
      h1, h2 { line-height: 1.25; }
      h1 { margin: 0; font-size: clamp(2.4rem, 9vw, 4.5rem); letter-spacing: -.06em; }
      .intro { max-width: 34rem; margin: 22px 0 0; color: var(--muted); font-size: 1.12rem; }
      section { margin-top: 18px; padding: 30px; border: 1px solid var(--line); border-radius: 18px; background: var(--surface); box-shadow: 0 8px 22px rgb(15 23 42 / .04); }
      h2 { margin: 0 0 12px; font-size: 1.25rem; }
      p { margin: 0; }
      .tags { display: flex; flex-wrap: wrap; gap: 10px; padding: 0; margin: 18px 0 0; list-style: none; }
      .tags li { padding: 7px 12px; border-radius: 999px; color: #1d4ed8; background: #eff6ff; font-size: .95rem; font-weight: 650; }
      .contact-note, footer { color: var(--muted); }
      footer { padding: 28px 4px 0; font-size: .9rem; text-align: center; }
      @media (max-width: 520px) { .page { width: min(100% - 24px, 760px); padding-top: 40px; } header { padding-bottom: 28px; } section { padding: 24px; border-radius: 14px; } }
    </style>
  </head>
  <body>
    <main class="page">
      <header>
        <p class="eyebrow">PERSONAL PAGE</p>
        <h1>신유찬</h1>
        <p class="intro">새로운 것을 배우고, 관심 있는 분야를 차근차근 탐색하고 있습니다. 이곳에 저의 이야기와 기록을 쌓아가려 합니다.</p>
      </header>
      <section aria-labelledby="about-title">
        <h2 id="about-title">소개</h2>
        <p>안녕하세요. 신유찬입니다. 반갑습니다!</p>
      </section>
      <section aria-labelledby="interests-title">
        <h2 id="interests-title">관심사</h2>
        <p>요즘 관심 있는 주제를 여기에 기록해 보세요.</p>
        <ul class="tags" aria-label="관심사 예시"><li>배움</li><li>기록</li><li>새로운 경험</li></ul>
      </section>
      <section aria-labelledby="contact-title">
        <h2 id="contact-title">연락처</h2>
        <p class="contact-note">연락처는 나중에 입력할 예정입니다.</p>
      </section>
      <footer>© 2026 신유찬</footer>
    </main>
  </body>
</html>
